[package]
name = "trackone-gateway-svc"
description = "Deployable HTTP and PostgreSQL runtime for VTL admission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
axum.workspace = true
base64.workspace = true
flate2.workspace = true
native-tls.workspace = true
postgres.workspace = true
postgres-native-tls.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
trackone-ledger.workspace = true
trackone-rfc3161.workspace = true

[dev-dependencies]
tower.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "trackone-vtl-gateway"
path = "src/main.rs"

[[bin]]
name = "trackone-vtl-export"
path = "src/export_main.rs"
