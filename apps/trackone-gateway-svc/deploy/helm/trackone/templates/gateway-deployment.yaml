{{- if .Values.gateway.enabled }}
{{- $mountTsaIntermediates := or .Values.gateway.env.tsaIntermediatesPem (and .Values.gateway.existingSecret .Values.gateway.existingSecretHasTsaIntermediates) }}
{{- $verifyPostgresTls := eq .Values.gateway.postgres.tlsMode "verify-full" }}
{{- $useManagedPostgresCa := and $verifyPostgresTls .Values.postgres.enabled .Values.postgres.tls.enabled }}
{{- $useExternalPostgresCa := and $verifyPostgresTls (not $useManagedPostgresCa) (or .Values.gateway.postgres.caPem (and .Values.gateway.existingSecret .Values.gateway.existingSecretHasPostgresCa)) }}
{{- $mountPostgresCa := or $useManagedPostgresCa $useExternalPostgresCa }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackone-gateway
  namespace: {{ include "trackone.namespace" . }}
  labels:
    app.kubernetes.io/name: trackone-gateway
    {{ include "trackone.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trackone-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trackone-gateway
        {{ include "trackone.commonLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "trackone.image" .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "trackone.gatewayConfigMapName" . }}
          env:
            - name: TRACKONE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "trackone.gatewaySecretName" . }}
                  key: TRACKONE_DATABASE_URL
            - name: TRACKONE_INGEST_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trackone.gatewaySecretName" . }}
                  key: TRACKONE_INGEST_BEARER_TOKEN
            - name: TRACKONE_INGEST_BEARER_TOKEN_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "trackone.gatewaySecretName" . }}
                  key: TRACKONE_INGEST_BEARER_TOKEN_PREVIOUS
                  optional: true
            - name: TRACKONE_TSA_CA_FILE
              value: /var/run/trackone-tsa/ca.pem
            - name: TRACKONE_TSA_CRLS_FILE
              value: /var/run/trackone-tsa/crls.pem
            {{- if $mountTsaIntermediates }}
            - name: TRACKONE_TSA_INTERMEDIATES_FILE
              value: /var/run/trackone-tsa/intermediates.pem
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.readinessInitialDelay }}
            periodSeconds: {{ .Values.gateway.probes.readinessPeriod }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.gateway.probes.livenessInitialDelay }}
            periodSeconds: {{ .Values.gateway.probes.livenessPeriod }}
          resources:
            {{ toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tsa-ca
              mountPath: /var/run/trackone-tsa
              readOnly: true
            {{- if $mountPostgresCa }}
            - name: postgres-ca
              mountPath: /var/run/trackone-postgres
              readOnly: true
            {{- end }}
      volumes:
        - name: tsa-ca
          secret:
            secretName: {{ include "trackone.gatewaySecretName" . }}
            items:
              - key: tsa-ca.pem
                path: ca.pem
              - key: tsa-crls.pem
                path: crls.pem
              {{- if $mountTsaIntermediates }}
              - key: tsa-intermediates.pem
                path: intermediates.pem
              {{- end }}
        {{- if $mountPostgresCa }}
        - name: postgres-ca
          secret:
            {{- if $useManagedPostgresCa }}
            secretName: {{ include "trackone.postgresTlsSecretName" . }}
            items:
              - key: ca.crt
                path: ca.pem
            {{- else }}
            secretName: {{ include "trackone.gatewaySecretName" . }}
            items:
              - key: postgres-ca.pem
                path: ca.pem
            {{- end }}
        {{- end }}
{{- end }}
