{{- if and .Values.postgres.enabled .Values.postgres.tls.enabled (not .Values.postgres.tls.existingSecret) }}
{{- $namespace := include "trackone.namespace" . -}}
{{- $secretName := include "trackone.postgresTlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" $namespace $secretName -}}
{{- $reuseExisting := false -}}
{{- if $existing -}}
{{- $existingData := default (dict) $existing.data -}}
{{- $reuseExisting = and (hasKey $existingData "ca.crt") (hasKey $existingData "tls.crt") (hasKey $existingData "tls.key") -}}
{{- end -}}
{{- $caCert := "" -}}
{{- $tlsCert := "" -}}
{{- $tlsKey := "" -}}
{{- if $reuseExisting -}}
{{- $caCert = index $existing.data "ca.crt" -}}
{{- $tlsCert = index $existing.data "tls.crt" -}}
{{- $tlsKey = index $existing.data "tls.key" -}}
{{- else -}}
{{- $ca := genCA (printf "%s-postgres-ca" .Release.Name) 3650 -}}
{{- $dnsNames := list "postgres" (printf "postgres.%s" $namespace) (printf "postgres.%s.svc" $namespace) (printf "postgres.%s.svc.cluster.local" $namespace) -}}
{{- $certificate := genSignedCert "postgres" nil $dnsNames 3650 $ca -}}
{{- $caCert = $ca.Cert | b64enc -}}
{{- $tlsCert = $certificate.Cert | b64enc -}}
{{- $tlsKey = $certificate.Key | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: postgres
    {{ include "trackone.commonLabels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $caCert | quote }}
  tls.crt: {{ $tlsCert | quote }}
  tls.key: {{ $tlsKey | quote }}
{{- end }}
