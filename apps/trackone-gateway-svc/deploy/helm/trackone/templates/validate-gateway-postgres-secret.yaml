{{- $usesExternalGatewaySecret := and .Values.gateway.enabled .Values.gateway.existingSecret }}
{{- $usesManagedPostgresCa := and .Values.postgres.enabled .Values.postgres.tls.enabled }}
{{- if and $usesExternalGatewaySecret .Values.gateway.postgres.caPem (eq .Values.gateway.postgres.tlsMode "verify-full") (not $usesManagedPostgresCa) }}
{{- fail "gateway.postgres.caPem cannot be combined with gateway.existingSecret; put postgres-ca.pem in the existing Secret and set gateway.existingSecretHasPostgresCa=true" }}
{{- end }}
