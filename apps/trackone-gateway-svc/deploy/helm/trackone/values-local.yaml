#
# Local/Minikube build-check override.
# Applies on top of the published-artifact defaults in values.yaml.
# Runtime config and credentials still come from the chart-managed
# ConfigMap/Secret objects; this file changes deployment behavior and opts
# into explicit local-only security exceptions.
#
namespace:
  create: true
  name: trackone

imagePullSecrets: []

otsCalendar:
  enabled: false
  image:
    repository: trackone/ots-calendar
    tag: local
    pullPolicy: Never
  persistence:
    enabled: true
    size: 1Gi

postgres:
  auth:
    allowInsecureDefaults: true
  # Explicit local-development exception: the bundled database and gateway
  # both use plaintext when the gateway is enabled with this override.
  tls:
    enabled: false
  persistence:
    enabled: true
    size: 5Gi

gateway:
  enabled: false
  postgres:
    tlsMode: disable
  image:
    repository: trackone/gateway
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30080

jobs:
  enabled: true
